<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="#ffffff"/>
  
  <g transform="translate(106, 106)">
    <!-- Outer geometric stash box / shield enclosure -->
    <rect x="10" y="10" width="280" height="280" rx="48" fill="#FFF6F0" stroke="#BC4800" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Stash shelf divider line -->
    <path d="M 10 150 L 290 150" stroke="#BC4800" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Top chamber: Tech microchip / circuit gadget symbol -->
    <rect x="110" y="55" width="80" height="60" rx="14" fill="#BC4800"/>
    <!-- Chip connector pins -->
    <path d="M 85 75 L 110 75 M 85 95 L 110 95 M 190 75 L 215 75 M 190 95 L 215 95" stroke="#BC4800" stroke-width="8" stroke-linecap="round"/>
    <!-- Inner core of chip / power dot -->
    <circle cx="150" cy="85" r="10" fill="#ffffff"/>
    
    <!-- Bottom chamber: Inventory organized compartments / neat storage units -->
    <rect x="52" y="184" width="84" height="68" rx="14" fill="#BC4800" opacity="0.12" stroke="#BC4800" stroke-width="10"/>
    <circle cx="94" cy="218" r="8" fill="#BC4800"/>
    
    <rect x="164" y="184" width="84" height="68" rx="14" fill="#BC4800"/>
    <!-- Checkmark / lightning stash indicator in right compartment -->
    <path d="M 194 218 L 202 226 L 218 208" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>